<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10131d"><title>FOLD//STRIKE · Mando remoto</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="controller.css"></head>
<body><header><div><b>FOLD//STRIKE</b><span id="status" role="status">Conectando con la computadora…</span></div><nav><button id="fullscreen">AMPLIAR</button><button data-action="back">ATRÁS</button><button data-action="start">PAUSA</button></nav></header>
<main><section class="movement"><div id="stick" role="group" aria-label="Movimiento: desliza para caminar, saltar o agacharte"><span class="up">▲</span><span class="left">◀</span><span class="right">▶</span><span class="down">▼</span><i></i></div><p>MUEVE Y DESLIZA · DIAGONALES</p></section>
